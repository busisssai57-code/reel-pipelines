name: Deploy Reel Studio (web) to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # No committed lockfile (package-lock.json is gitignored) -> use install, not ci.
      - name: Install dependencies
        working-directory: web
        run: npm install

      # GitHub Pages serves this repo at /reel-pipelines, so build with that base.
      # adapter-static emits index.html as the SPA fallback; GitHub Pages routes
      # unknown paths through 404.html, so mirror it for client-side routing.
      - name: Build
        working-directory: web
        env:
          BASE_PATH: /reel-pipelines
        run: |
          npm run build
          cp build/index.html build/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web/build'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v3
